name: PR CI

# lint and test are required checks on main. They are gates over the jobs that
# do the work, so keep those two names, or update the branch protection rule.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # code is false when a change touches only Markdown, the logos, or the issue
  # and PR templates, and the jobs below then skip. A skipped job counts as
  # passing a required check, so a docs-only PR can still merge. They run unless
  # code is false, so a failure here runs everything rather than nothing.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true

          # A new branch or a forced push has no base to compare with.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE" HEAD)
            docs='(\.md|^LICENSE|^docs/assets/.*|^\.github/ISSUE_TEMPLATE/.*)$'

            if [ -n "$changed" ]; then
              code=false

              while IFS= read -r path; do
                if ! [[ $path =~ $docs ]]; then
                  code=true
                fi
              done <<<"$changed"
            fi
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code" >> "$GITHUB_STEP_SUMMARY"

  # lint is the required check. It passes when vet and staticcheck passed, or
  # both skipped on a change to docs alone.
  lint:
    needs: [vet, staticcheck]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ needs.vet.result }} ${{ needs.staticcheck.result }}
        run: |
          for result in $RESULTS; do
            case $result in
              success | skipped) ;;
              *) echo "a lint job ended with $result" && exit 1 ;;
            esac
          done

  vet:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: ./.github/actions/setup-go
        with:
          key: vet
          paths: ~/.cache/golangci-lint
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - run: make build
      - run: make vet
      # Only main saves its caches, which pull requests then start from.
      - if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  # staticcheck takes the longest of the linters, so it has a runner of its own.
  staticcheck:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: ./.github/actions/setup-go
        with:
          key: staticcheck
          paths: ~/.cache/staticcheck
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: make staticcheck
      # Only main saves its caches, which pull requests then start from.
      - if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  # Runs on every build, between Dependabot's weekly runs: fails on a
  # vulnerability the code reaches, and lists outdated direct dependencies in
  # the run summary. Not required, so a new advisory does not block unrelated PRs.

  deps:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: ./.github/actions/setup-go
        with:
          key: deps
      - shell: bash
        run: |
          make deps | tee deps.txt
          {
            echo "### Outdated direct dependencies"
            grep -E ' -> ' deps.txt || echo "None."
          } >> "$GITHUB_STEP_SUMMARY"

      # Only main saves its caches, which pull requests then start from.
      - if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  # test is the required check. It passes when the two jobs that test on
  # PostgreSQL passed, or both skipped on a change to docs alone.
  test:
    needs: [postgres, probes]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ needs.postgres.result }} ${{ needs.probes.result }}
        run: |
          for result in $RESULTS; do
            case $result in
              success | skipped) ;;
              *) echo "a test job ended with $result" && exit 1 ;;
            esac
          done

  # Unit tests, plus every database test on PostgreSQL, under the race detector,
  # except the value probes, which have a runner of their own, then the tests
  # of the nested modules. Tests run in
  # parallel, each on a schema of its own, after the few that must run alone,
  # and -failfast stops a package at its first failure.
  postgres:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ant
          POSTGRES_PASSWORD: ant
          POSTGRES_DB: ant_test
        ports:
          - "55432:5432"
        options: >-
          --health-cmd "pg_isready -U ant -d ant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
    env:
      ANT_TEST_DATABASES: postgres
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: ./.github/actions/setup-go
        with:
          key: postgres
      - shell: bash
        run: |
          packages=$(go list ./... | grep -v /tests/features/value_handling/probes/ | tr '\n' ' ')
          make test PACKAGES="$packages" TESTFLAGS="-v -race -failfast"
      # PACKAGES leaves out the nested modules, so their tests run here.
      - run: make test-modules TESTFLAGS="-v -race -failfast"
      # Only main saves its caches, which pull requests then start from.
      - if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  # The value probes take the longest to compile, so they build on a runner of
  # their own. They start no goroutines, so the race detector is left out.
  probes:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ant
          POSTGRES_PASSWORD: ant
          POSTGRES_DB: ant_test
        ports:
          - "55432:5432"
        options: >-
          --health-cmd "pg_isready -U ant -d ant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
    env:
      ANT_TEST_DATABASES: postgres
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: ./.github/actions/setup-go
        with:
          key: probes
      - run: make test PACKAGES=./tests/features/value_handling/probes/... TESTFLAGS="-v -failfast"
      # Only main saves its caches, which pull requests then start from.
      - if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  # The other dialects run the database tests in two shards side by side: the
  # matrix, which is the slowest package, and the rest. Not required, so a flaky
  # container does not block a merge, but read them before merging.

  dialects:
    name: ${{ matrix.dialect }} (${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [mysql, mariadb, sqlserver]
        shard: [matrix, rest]
        include:
          - dialect: mysql
            target: test-mysql
            image: mysql:8.4
            port: "53306:3306"
            env: '{"MYSQL_ROOT_PASSWORD":"ant","MYSQL_USER":"ant","MYSQL_PASSWORD":"ant","MYSQL_DATABASE":"ant_test"}'
            health: mysql -uant -pant -h127.0.0.1 -e 'SELECT 1' ant_test
          - dialect: mariadb
            target: test-mariadb
            image: mariadb:11.8
            port: "53307:3306"
            env: '{"MARIADB_ROOT_PASSWORD":"ant","MARIADB_USER":"ant","MARIADB_PASSWORD":"ant","MARIADB_DATABASE":"ant_test"}'
            health: healthcheck.sh --connect --innodb_initialized
          - dialect: sqlserver
            target: test-mssql
            image: mcr.microsoft.com/mssql/server:2022-latest
            port: "51433:1433"
            env: '{"ACCEPT_EULA":"Y","MSSQL_SA_PASSWORD":"Ant_test_1!"}'
            health: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ant_test_1!' -Q 'SELECT 1'
    services:
      database:
        image: ${{ matrix.image }}
        env: ${{ fromJSON(matrix.env) }}
        ports:
          - ${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: ./.github/actions/setup-go
        with:
          key: dialects-${{ matrix.shard }}
      - shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          TARGET: ${{ matrix.target }}
        run: |
          matrix=github.com/skudra-go/ant/tests/matrix

          if [ "$SHARD" = matrix ]; then
            tests=$matrix
          else
            tests=$(make -s dialect-tests | grep -vxF "$matrix" | tr '\n' ' ')
          fi

          make "$TARGET" TESTS="$tests" TESTFLAGS=-failfast
      # Only main saves its caches, which pull requests then start from.
      - if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  sqlite:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: ./.github/actions/setup-go
        with:
          key: sqlite
      - run: make test-sqlite TESTFLAGS=-failfast
      # Only main saves its caches, which pull requests then start from.
      - if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

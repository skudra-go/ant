# Databases for integration tests. Ports match internal/testdb. No volumes, so
# make db-down discards all data.
services:
  postgres:
    image: postgres:17
    # Test packages run side by side, each with PARALLEL tests that open pools
    # of their own, which on a machine with many CPUs passes the default limit
    # of 100 connections.
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_USER: ant
      POSTGRES_PASSWORD: ant
      POSTGRES_DB: ant_test
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ant -d ant_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ant
      MYSQL_USER: ant
      MYSQL_PASSWORD: ant
      MYSQL_DATABASE: ant_test
    ports: ["127.0.0.1:53306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysql -uant -pant -h127.0.0.1 -e 'SELECT 1' ant_test"]
      interval: 2s
      timeout: 5s
      retries: 60

  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: ant
      MARIADB_USER: ant
      MARIADB_PASSWORD: ant
      MARIADB_DATABASE: ant_test
    ports: ["127.0.0.1:53307:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Ant_test_1!
    ports: ["127.0.0.1:51433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ant_test_1!' -Q 'SELECT 1'"]
      interval: 3s
      timeout: 5s
      retries: 60
